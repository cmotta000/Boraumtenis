name: Deploy web para GitHub Pages

on:
  push:
    branches: [principal]
  workflow_dispatch:

# Permissões que o deploy-pages precisa para publicar o artefato.
permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; não cancela o que já está publicando.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sem `cache: npm` de propósito: um cache parcial de ~/.npm é suspeito de
      # ter produzido um node_modules incompleto (o build falhou ao resolver
      # expo-router/entry, que existe no pacote publicado e num npm ci limpo).
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # O entry do expo-router é o ponto de partida do bundle (package.json
      # "main"). Se ele não veio, reinstala antes de gastar minutos no export.
      - name: Confere a instalação
        run: |
          npm ls expo-router || true
          if [ ! -f node_modules/expo-router/entry.js ]; then
            echo "::warning::expo-router/entry.js ausente após npm ci — reinstalando."
            rm -rf node_modules
            npm install --no-audit --no-fund
          fi
          ls -l node_modules/expo-router/entry.js

      # Estes dois valores NÃO são segredos: o prefixo EXPO_PUBLIC_ faz o Expo
      # embutir ambos no bundle JS que vai para o navegador, então qualquer
      # visitante do site consegue lê-los. Quem protege os dados é a RLS do
      # Supabase, não o sigilo da chave publishable. Ficam aqui em texto para o
      # build não depender de secrets configurados na interface do GitHub.
      - name: Export web
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://qtsjuaogsybnlmvpggpu.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_4W4xI85VEAZdzxozOT1sAg_u_n0w7H2
        run: npx expo export --platform web

      - name: Prepara o dist para o Pages
        run: |
          # O Expo gera pastas com underscore (_expo/); sem isso o Jekyll as ignora.
          touch dist/.nojekyll
          # Fallback de SPA: rotas dinâmicas (/partida/<id>) não têm HTML estático,
          # então o 404 do Pages devolve o app e o expo-router resolve no cliente.
          cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
